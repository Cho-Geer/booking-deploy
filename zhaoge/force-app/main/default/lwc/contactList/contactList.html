<template>
    <template if:true={errors}>
        <lightning-card>
            <p><mark>{errors}</mark></p>
        </lightning-card>
    </template>
    <template if:false={errors}>
        <lightning-card title="子取引先責任者" icon-name="standard:standard2">
            <lightning-datatable
                key-field="id"
                data={contacts}
                columns={columns}></lightning-datatable>
        </lightning-card>
    </template>
</template>
