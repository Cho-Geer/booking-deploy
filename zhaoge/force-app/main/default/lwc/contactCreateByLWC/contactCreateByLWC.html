<template>
    <tr key={key} class="slds-hint-parent">
        <td>
            <div class="slds-truncate">
                <lightning-input type="checkbox" data-id="inputIndex" checked="false"
                    onchange={handleInputIndexChanged}>
                </lightning-input>
            </div>
        </td>
        <td>
            <div class="slds-truncate">
                <lightning-input type="text" data-id="inputLastName" variant="label-hidden"
                    placeholder="LastNameを入力してください" required="true"></lightning-input>
            </div>
        </td>
        <td>
            <div class="slds-truncate">
                <lightning-input type="text" data-id="inputFirstName" variant="label-hidden"></lightning-input>
            </div>
        </td>
        <td>
            <div class="slds-truncate" onkeyup={handleAccountSelected}>
                <lightning-input type="search" data-id="inputAccount" variant="label-hidden"></lightning-input>
            </div>
        </td>
        <td>
            <div class="slds-form-element">
                <div class="slds-form-element__control">
                    <div class="slds-combobox_container slds-has-selection">
                        <div data-id="comboboxWrapper"
                            class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click"
                            aria-expanded="false" aria-haspopup="listbox" role="combobox">
                            <div data-id="inputIconWrapper"
                                class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right"
                                role="none">
                                <span data-id="inputIconContact"
                                    class="slds-input__icon slds-input__icon_left slds-hide">
                                    <lightning-icon icon-name="standard:contact" size="xx-small"></lightning-icon>
                                </span>
                                <input type="text" class="slds-input slds-combobox__input" data-id="combobox-id-1"
                                    aria-autocomplete="list" aria-controls="recordTypeListWrapper" autocomplete="off"
                                    role="textbox" placeholder="Search..." value={listboxSearchText} oninput={handleAccountSearch}
                                    onmousedown={handleMyAccountListShow} onblur={handleMyAccountListHide} />
                                <span data-id="inputIconSearch" class="slds-input__icon slds-input__icon_right">
                                    <lightning-icon icon-name="utility:search" size="xx-small"></lightning-icon>
                                </span>
                                <span data-id="inputIconClose" class="slds-input__icon slds-input__icon_right slds-hide"
                                    onclick={handleSelectedContactClear} style="cursor:pointer;pointer-events: auto;">
                                    <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                                </span>
                            </div>
                            <div data-id="recordTypeListWrapper" class="slds-dropdown slds-dropdown_length-with-icon-7"
                                role="listbox" style="width:100%;overflow:hidden;">
                                <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                    <li if:true={selectedFlag} role="presentation" class="slds-listbox__item">
                                        <div id="option0"
                                            class="slds-media slds-media_center slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                            role="option" onmousedown={handleModalOpend}>
                                            <span class="slds-media__figure slds-listbox__option-icon">
                                                <span class="slds-icon_container slds-icon-utility-search">
                                                    <lightning-icon icon-name="utility:search" size="x-small">
                                                    </lightning-icon>
                                                </span>
                                            </span>
                                            <span class="slds-media__body">
                                                <span
                                                    class="slds-listbox__option-text slds-listbox__option-text_entity">{listboxSearchText}</span>
                                            </span>
                                        </div>
                                    </li>
                                    <template for:each={listboxForAccounts} for:item="account" for:index="index">
                                        <c-contact-create-by-l-w-c-child-for-account-listbox key={account.id}
                                            account={account} index={index} search-text={listboxSearchText}
                                            onlistboxoptionselected={handleListboxOptionSelected}>
                                        </c-contact-create-by-l-w-c-child-for-account-listbox>
                                    </template>
<li role="presentation" class="slds-listbox__item">
    <div id="option6" class="slds-media slds-media_center slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta" role="option">
        <span class="slds-media__figure slds-listbox__option-icon">
                                                <span class="slds-icon_container slds-icon-utility-search">
                                                    <lightning-icon icon-name="utility:add" size="x-small">
                                                    </lightning-icon>
                                                </span>
        </span>
        <span class="slds-media__body">
                                                <span
                                                    class="slds-listbox__option-text slds-listbox__option-text_entity">新規作成</span>
        </span>
    </div>
</li>
</ul>
</div>
</div>
</div>
</div>
</div>
</td>
<td>
    <div class="slds-truncate">
        <lightning-button-icon icon-name="utility:delete" variant="brand" size="small" onclick={handleDeleted}>
        </lightning-button-icon>
    </div>
</td>
</tr>
<template if:true={modalOpenFlag}>
    <c-account-list-model search-accounts={listAccounts} modify-flag={modifyFlag} onmodified={handleModified} oncancel={handleCancel} onaccountlink={handleAccountLink} onrecorddetailfocus={handleRecorddetailfocus}>
    </c-account-list-model>
</template>
<template if:true={recordDetailOpenFlag}>
    <c-record-detail-lwc record-id={recordId} record-name={recordName} page-mode={pageMode} onmodified={handleModified} oncancel={handleRecordDetailCancel}></c-record-detail-lwc>
</template>
</template>
