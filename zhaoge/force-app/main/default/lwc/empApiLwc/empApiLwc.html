<template>
    <lightning-card title="EmpApi Example" icon-name="custom:custom14">
        <div class="slds-wrapper">
        <div class="slds-text-heading_small">
            Use the buttons below to subscribe and unsubscribe to a streaming channel!
                <div class="">
                    <lightning-input label="Channel Name" value={channelName} onchange={handleChannelName}>
                    </lightning-input>
                </div>
            <lightning-button label="subscribe" variant="success" title="Subscribe" onclick={handleSubscribe}
                disabled={isSubscribeDisabled} class="slds-var-m-left_x-small"></lightning-button>
            <lightning-button label="unsubscribe" variant="destructive" title="Unsubscribe" onclick={handleUnsubscribe}
                disabled={isUnsubscribeDisabled} class="slds-var-m-left_x-small"></lightning-button>
        </div>
    </div>
    </lightning-card>
</template>
