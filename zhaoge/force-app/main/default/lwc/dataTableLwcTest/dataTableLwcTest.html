<template>
    <lightning-card title="Account List"></lightning-card>
    <template if:true={accounts.data}>
        <lightning-datatable
            key-field="id"
            columns={columns}
            data={data}
            show-row-number-column
            row-number-offset={rowOffset}
            hide-checkbox-column
            onrowaction={handleRowAction}
            >
        </lightning-datatable>
    </template>
</template>
