<template>
    <section class="slds-modal slds-fade-in-open slds-modal__small">
        <div class="slds-modal__container">
            <div class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close" title="Close">
                    <lightning-icon icon-name="utility:close" size="small" variant="inverse" onclick={handleCancel}></lightning-icon>
                </button>
                <span class="slds-modal__title slds-hyphenate">取引先レコードタイプ</span>
            </div>
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-radio-group name="recordTypeGroup"
                                        label="取引先 レコードタイプ："
                                        options={recordTypeOptions}
                                        value={value}
                                        type="radio">
                </lightning-radio-group>
            </div>
            <div class="slds-modal__footer">
                <lightning-button label="キャンセル" onclick={handleCancel}></lightning-button>
                <lightning-button class="slds-m-left_small" label="次へ" variant="brand" onclick={handleChanged}></lightning-button>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
