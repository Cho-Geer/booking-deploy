<template>
    <li role="presentation" class="slds-listbox__item">
        <div id="option1"
            class="slds-media slds-media_center slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
            role="option" onmousedown={handleListboxOptionSelected}>
            <span class="slds-media__figure slds-listbox__option-icon">
                <span class="slds-icon_container slds-icon-standard-contact">
                    <lightning-icon icon-name="standard:contact" size="x-small"></lightning-icon>
                </span>
            </span>
            <span class="slds-media__body">
                <span data-id="optionText" class="slds-listbox__option-text slds-listbox__option-text_entity" title={account.name}>{account.name}</span>
            </span>
        </div>
    </li>
</template>
