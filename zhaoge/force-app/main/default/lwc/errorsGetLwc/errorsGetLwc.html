<template>
    <template if:true={error}>
        <lightning-card>
            <p>{error}</p>
        </lightning-card>
    </template>
<template if:false={error}>
        <lightning-card title="取引先" icon-name="standard:standard1">
            <div class="slds-card__body">
                <lightning-datatable 
                    id="contacts"
                    key-field="id"
                    data={contacts}
                    columns={columns}></lightning-datatable>
            </div>
        </lightning-card>
    </template>
</template>
