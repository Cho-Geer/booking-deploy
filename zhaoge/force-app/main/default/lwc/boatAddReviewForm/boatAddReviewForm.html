<template>
    <!-- lightning data service code -->
    <!-- <lightning-record-edit-form> using boatReviewObject -->
        <lightning-record-edit-form
            object-api-name="BoatReview__c"
            onsuccess={handleSuccess}
            onsubmit={handleSubmit}
            onerror={handleError}>
    <lightning-layout multiple-rows vertical-align="start">
        <lightning-messages></lightning-messages>
        <lightning-layout-item size="12" padding="horizontal-small">
            <div class="slds-form-element">
                <!-- review subject field code using nameField -->
                <label class="slds-form-element__label"><abbr class="slds-required" title="required">*</abbr>{labelSubject}</label>
                <lightning-input-field field-name="Name" variant="label-hidden" required></lightning-input-field>
            </div>
        </lightning-layout-item>
        <lightning-layout-item size="4" padding="horizontal-small">
            <div class="slds-form-element">
                <label class="slds-form-element__label" for="record-name"><abbr class="slds-required" title="required">*</abbr>{labelRating}</label>
                <div class="slds-form-element__control">
                    <!-- add five star rating component -->
                    <c-five-star-rating value={rating} onratingchange={handleRatingChanged}>
                    </c-five-star-rating>
                </div>
            </div>
        </lightning-layout-item>
        <lightning-layout-item padding="horizontal-small">
            <!-- review comment field code using commentField -->
            <lightning-input-field field-name="Comment__c" variant="label-stacked" required></lightning-input-field>
        </lightning-layout-item>
    </lightning-layout>
    <div class="slds-align_absolute-center" style="margin-top: 5px">
        <!-- add submit button -->
        <lightning-button label="Submit" type="submit" icon-name="utility:save"></lightning-button>
    </div>
    </lightning-record-edit-form>
    <!-- </lightning-record-edit-form> -->
</template>
