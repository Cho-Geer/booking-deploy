<template>
    <div class="slds-page-header">
        <div class="slds-page-header__title">
            <span>{title}</span>
        </div>
        <div class="slds-page-header__body">
            <div class="slds-grid slds-wrap">
                <div class="slds-col slds-size_4-of-12">
                    <lightning-input type="text" label="input1" value={input1} onchange={handleChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_4-of-12">
                    <div class="slds-grid">output2</div>
                    <div class="slds-grid">
                        <lightning-formatted-text value={output1}></lightning-formatted-text>
                    </div>
                </div>
                <div class="slds-col slds-size_4-of-12">
                    <lightning-input type="text" label="input2" value={input2} onchange={handleChange}></lightning-input>
                </div>
            </div>
        </div>
    </div>
</template>
