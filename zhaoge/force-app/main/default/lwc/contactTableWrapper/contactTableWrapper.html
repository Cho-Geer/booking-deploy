<template>
    <table data-id="table" class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
        <thead>
            <tr>
                <th>
                    <div class="slds-truncate">No</div>
                </th>
                <th>
                    <div class="slds-truncate">Last Name</div>
                </th>
                <th>
                    <div class="slds-truncate">Account</div>
                </th>
                <th>
                    <div class="slds-truncate">RecordType</div>
                </th>
                <th>
                    <div class="slds-truncate"></div>
                </th>
            </tr>
        </thead>
        <tbody>
            <template for:each={contacts} for:item="con" for:index="index">
                <c-contact-record-create key={con.index} contact={con.contact} index={index} accounts={accounts} search-flag={searchFlag} onsearchtext={handelSearched}
                    style="display:contents;"></c-contact-record-create>
            </template>
        </tbody>
    </table>
</template>
