<template>
    <div class="slds-is-relative" style="height: calc(100vh - 238px);width:calc(100%);">
        <div class="slds-is-absolute" style="top:0;bottom:0;">
            <div class="slds-is-relative" style="height:100%;">
                <div class="slds-card slds-grid" style="flex-direction:column;height:100%;width:100%;">
                    <div class="slds-card__header slds-grid" style="flex-grow:0;">
                        <div class="slds-media slds-media_center slds-has-flexi-truncate">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="custom:custom1" size="small"></lightning-icon>
                            </div>
                            <span class="slds-media__body">
                                Demo
                            </span>
                        </div>
                        <div class="slds-no-flex">
                            <lightning-button label="作成" variant="brand" onclick={handleBulkCreate}></lightning-button>
                        </div>
                    </div>
                    <div class="slds-card__body slds-grow">
                        <div class="slds-is-relative" style="height:100%;width:inherit;">
                            <slot name="tableWrapper">
                                <c-contact-table-wrapper slot="tableWrapper" contacts={contacts}
                                    style="display:contents;"></c-contact-table-wrapper>
                            </slot>
                        </div>
                    </div>
                    <div class="slds-card__footer slds-grid" style="flex-grow:0;flex-direction:row-reverse;">
                        <lightning-button label="一括作成" variant="brand" onclick={handleBulkCreate}></lightning-button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
