<template>
    <div class="slds-grid slds-wrap">
        <div class="slds-col slds-size_5-of-12">
            <div class="slds-card slds-is-absolute" data-id="mainCard">
                <div class="slds-grid slds-einstein-header slds-card__header"
                    data-id="mainHeader">
                    <div class="slds-media slds-media_center
                        slds-has-flexi-truncate">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:contact"
                                size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title">
                                <a href="#" class="slds-card__header-link
                                    slds-truncate">
                                    <span>取引先責任者一括登録</span>
                                </a>
                            </h2>
                        </div>
                    </div>
                    <div class="slds-no-flex">
                        <lightning-button variant="brand" label="一括登録"
                            onclick={handleBulkCommit}></lightning-button>
                    </div>
                </div>
                <div class="slds-card__body" data-id="cardBody">
                    <div class="slds-is-relative" data-id="mainBodyRelative">
                        <div class="slds-is-absolute"
                            data-id="mainBodyAbsolute">
                            <div class="slds-is-relative slds-scrollable_none"
                                data-id="mainBodyTableWrapper">
                                <div class="slds-is-static slds-scrollable_y"
                                    data-id="mainBodyStatic">
                                    <table class="slds-table
                                        slds-table_cell-buffer
                                        slds-table_bordered
                                        slds-table_col-bordered">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col">
                                                    <div class="slds-truncate">
                                                        <lightning-input
                                                            data-id="inputCheckbox"
                                                            type="checkbox"
                                                            checked={checkboxChecked}
                                                            onchange={handleCheckbox}>
                                                        </lightning-input>
                                                    </div>
                                                </th>
                                                <th scope="col">
                                                    <div class="slds-truncate">{objectInfo.lastNameLabel}</div>
                                                </th>
                                                <th scope="col">
                                                    <div class="slds-truncate">{objectInfo.firstNameLabel}</div>
                                                </th>
                                                <th scope="col">
                                                    <div class="slds-truncate">{objectInfo.recordTypeLabel}</div>
                                                </th>
                                                <th scope="col">
                                                    <div class="slds-truncate">{objectInfo.accountLabel}</div>
                                                </th>
                                                <th scope="col">
                                                    <div>
                                                        <lightning-button-menu
                                                            menu-alignment="right"
                                                            icon-size="small"
                                                            variant="container"
                                                            alternative-text="Show
                                                            menu"
                                                            icon-name="utility:settings"
                                                            onselect={handleButtonSelect}>
                                                            <lightning-menu-item
                                                                icon-name="utility:add"
                                                                label="Add Row"></lightning-menu-item>
                                                            <lightning-menu-item
                                                                icon-name="utility:delete"
                                                                label="Delete
                                                                Row"></lightning-menu-item>
                                                        </lightning-button-menu>
                                                    </div>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={contactList} for:item="contact" for:index="index">
                                                <c-contact-create-by-l-w-c key={contact.index}></c-contact-create-by-l-w-c>
                                            </template>
</tbody>
</table>
</div>
</div>
</div>
</div>
</div>
<div class="slds-card__footer" data-id="mainFooter">
    <div class="slds-clearfix">
        <div class="slds-float_right">
            <lightning-button variant="brand" label="一括登録" onclick={handleBulkCommit}>
            </lightning-button>
        </div>
    </div>
</div>
</div>
</div>
<div class="slds-col slds-size_7-of-12">
    bbbb
</div>
</div>
</template>
