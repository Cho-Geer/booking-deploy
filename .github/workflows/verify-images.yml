name: Verify Docker Images Deployment Readiness

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'compose/**'
      - 'scripts/verify-images.sh'
      - '.github/workflows/verify-images.yml'
  push:
    branches:
      - master
      - develop
    paths:
      - 'compose/**'
      - 'scripts/verify-images.sh'
      - '.github/workflows/verify-images.yml'
  workflow_dispatch:

jobs:
  verify-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify images for ${{ matrix.environment }}
        run: |
          chmod +x scripts/verify-images.sh
          ./scripts/verify-images.sh ${{ matrix.environment }}
